<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" />
  <title>{% block title %}Painel Gomme Fenice{% endblock %}</title>
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; background: #f5f5f5; color: #222; }
    header { background: #1b1b1b; color: #fff; padding: 12px 20px; display: flex; gap: 20px; align-items: center; }
    header a { color: #fff; text-decoration: none; opacity: 0.85; }
    header a:hover { opacity: 1; }
    main { padding: 20px; max-width: 1000px; margin: 0 auto; }
    table { width: 100%; border-collapse: collapse; background: #fff; }
    th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid #eee; font-size: 14px; }
    th { background: #fafafa; }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 12px; }
    .badge-stage { background: #e0e7ff; color: #333; }
    .badge-flag { background: #fee2e2; color: #991b1b; }
    .badge-paused { background: #fef3c7; color: #92400e; }
    .badge-transferred { background: #dcfce7; color: #166534; }
    .bubble { padding: 8px 12px; border-radius: 10px; margin-bottom: 6px; max-width: 70%; }
    .bubble.user { background: #fff; border: 1px solid #ddd; }
    .bubble.assistant { background: #dbeafe; margin-left: auto; }
    .bubble.human_agent { background: #fde68a; margin-left: auto; }
    .row { display: flex; gap: 20px; }
    .row > div { min-width: 0; }
    pre {
      white-space: pre-wrap; word-break: break-word; overflow-wrap: anywhere;
      background: #fafafa; border: 1px solid #eee; border-radius: 6px; padding: 10px; font-size: 12px;
    }
    form.inline { display: inline; }
    button { cursor: pointer; }
    .card { background: #fff; border: 1px solid #e5e5e5; border-radius: 8px; padding: 16px; margin-bottom: 16px; }
    .field { margin-bottom: 14px; }
    .field label { display: block; font-weight: 600; margin-bottom: 4px; font-size: 14px; }
    .field .hint { font-size: 12px; color: #666; margin-top: 4px; }
    select, input[type="text"], input[type="password"], input[type="time"], textarea {
      width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 6px; font-family: inherit; font-size: 14px;
      box-sizing: border-box;
    }
    .key-row input[type="text"] { flex: 1; min-width: 0; }
    textarea { min-height: 260px; font-family: ui-monospace, monospace; font-size: 13px; }
    .key-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
    .key-row input[type="password"] { flex: 1; }
    .key-status-ok { color: #166534; font-size: 12px; white-space: nowrap; }
    .key-status-missing { color: #92400e; font-size: 12px; white-space: nowrap; }
    .save-bar { margin-top: 16px; }
    .save-bar button {
      background: #1b1b1b; color: #fff; border: none; padding: 10px 20px; border-radius: 6px; font-size: 14px;
    }
    .htmx-indicator { opacity: 0; transition: opacity 200ms ease-in; }
    .htmx-request .htmx-indicator, .htmx-request.htmx-indicator { opacity: 1; }
  </style>
</head>
<body>
  <header>
    <strong>Gomme Fenice - Painel do Agente (Matteo)</strong>
    <a href="/dashboard/">Conversas</a>
    <a href="/dashboard/teste-rapido">Teste Rápido</a>
    <a href="/dashboard/costs">Custos</a>
    <a href="/dashboard/base-conhecimento">Base de Conhecimento</a>
    <a href="/dashboard/settings">Configurações</a>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
